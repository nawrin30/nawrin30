<svg xmlns="http://www.w3.org/2000/svg" width="495" height="270" viewBox="0 0 495 270">

        <defs>

          <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#22c55e"/>
          </linearGradient>

          <radialGradient id="background">
            <stop offset="0%" stop-color="#10172e"/>
            <stop offset="100%" stop-color="#080d20"/>
          </radialGradient>

          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <style>

            @keyframes pulse {
              0%, 100% { opacity: .35; }
              50% { opacity: .9; }
            }

            @keyframes appear {
              from {
                opacity: 0;
                stroke-dashoffset: 500;
              }
              to {
                opacity: 1;
              }
            }

            .card {
              transition: filter .3s ease;
            }

            .card:hover {
              filter: brightness(1.2);
            }

            .donut-segment {
              animation: appear 1.8s ease both;
              filter: url(#glow);
              transition: opacity .3s ease;
            }

            .donut-segment:hover {
              opacity: .7;
            }

            .outer-glow {
              animation: pulse 3s ease-in-out infinite;
            }

            .legend {
              font-family: Segoe UI, Arial, sans-serif;
            }

          </style>

        </defs>
        
<rect class="card" x="1" y="1" width="493" height="268" rx="22" fill="url(#background)" stroke="url(#border)" stroke-width="1.5"/>
<text x="25" y="36" fill="#e0e7ff" font-family="Segoe UI,Arial" font-size="18" font-weight="700">Top Language by Repository</text>

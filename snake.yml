name: Generate GitHub Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Contribution Graph
        run: |
          mkdir -p assets

          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          username = "nawrin30"

          url = f"https://github.com/users/{username}/contributions"
          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          html = requests.get(url, headers=headers).text
          soup = BeautifulSoup(html, "html.parser")

          cells = soup.select("td.ContributionCalendar-day")

          levels = []

          for cell in cells:
              date = cell.get("data-date", "")
              level = cell.get("data-level", "0")
              if date:
                  levels.append((date, int(level)))

          levels = levels[-371:]

          cell_size = 13
          gap = 3
          rows = 7

          width = 53 * (cell_size + gap)
          height = rows * (cell_size + gap) + 30

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}" height="{height}"
          viewBox="0 0 {width} {height}">

          <rect width="100%" height="100%" rx="8" fill="#0d1117"/>

          <text x="15" y="22"
                fill="#e6edf3"
                font-family="Arial"
                font-size="14"
                font-weight="600">
                GitHub Contributions
          </text>
          '''

          colors = {
              0: "#161b22",
              1: "#0e4429",
              2: "#006d32",
              3: "#26a641",
              4: "#39d353"
          }

          for i, (date, level) in enumerate(levels):
              week = i // 7
              day = i % 7

              x = 15 + week * (cell_size + gap)
              y = 35 + day * (cell_size + gap)

              color = colors.get(level, colors[0])

              svg += f'''
              <rect x="{x}" y="{y}"
                    width="{cell_size}"
                    height="{cell_size}"
                    rx="2"
                    fill="{color}">
                <title>{date} — Level {level}</title>
              </rect>
              '''

          svg += "</svg>"

          with open("assets/github-contribution-graph.svg", "w") as f:
              f.write(svg)

          PY

      - name: Commit Graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-contribution-graph.svg

          git diff --cached --quiet || git commit -m "Update contribution graph"

          git push